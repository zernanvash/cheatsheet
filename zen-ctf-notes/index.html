<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
  <title>Zen CTF Notes | H4G</title>
  <style>
    :root{color-scheme:dark;--bg:#070a0f;--panel:#0e141c;--panel2:#131b25;--line:#27313d;--text:#e8edf4;--muted:#929eac;--accent:#a5b4fc;--code:#090e14}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,sans-serif}button,input{font:inherit}a{color:var(--accent)}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:rgba(7,10,15,.95);backdrop-filter:blur(10px);z-index:4}.brand{font-weight:800;text-decoration:none;color:var(--text)}.brand span{color:var(--accent)}.back{text-decoration:none;color:var(--muted)}.back:hover{color:#fff}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:20px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:.72rem;font-weight:800}h1{font-size:1.5rem;margin:.25rem 0}.intro,.meta{color:var(--muted);font-size:.86rem}.search{width:100%;margin:12px 0 16px;border:1px solid var(--line);border-radius:6px;background:var(--code);color:var(--text);padding:10px}.folder{margin:5px 0}.folder summary{cursor:pointer;color:#cbd3dd;padding:7px 8px;border-radius:5px;font-weight:650;list-style:none}.folder summary::before{content:'▸';display:inline-block;width:18px;color:var(--muted)}.folder[open] summary::before{content:'▾'}.folder summary:hover,.note-link:hover{background:var(--panel2);color:#fff}.note-link{display:flex;justify-content:space-between;gap:8px;margin-left:12px;padding:7px 9px;color:var(--muted);text-decoration:none;border-left:1px solid var(--line)}.note-link.active{color:#fff;background:var(--panel2);border-left-color:var(--accent)}.note-link small{opacity:.65}main{min-width:0;padding:34px clamp(20px,5vw,70px)}.toolbar{max-width:980px;margin:0 auto 20px;color:var(--muted);display:flex;justify-content:space-between;gap:15px}.document{max-width:980px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(22px,5vw,54px)}.document h1{font-size:2.2rem;margin-bottom:.2rem}.document h2{font-size:1.4rem;margin-top:2.2rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}.document h3{font-size:1.08rem;margin-top:1.6rem}.source{color:var(--muted);font:12px ui-monospace,monospace}.content{margin-top:30px}.content p,.content li{color:#cbd3dd}.content code{background:var(--code);border:1px solid #202a35;border-radius:4px;padding:.12em .35em;font-family:ui-monospace,monospace}.content ul,.content ol{padding-left:1.35rem}.table-wrap{overflow:auto;margin:18px 0;border:1px solid var(--line);border-radius:7px}.content table{width:100%;border-collapse:collapse;min-width:650px}.content th,.content td{padding:9px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.content th{background:var(--panel2);color:#fff}.content tr:last-child td{border-bottom:0}.code{position:relative;margin:16px 0;border:1px solid #303b49;border-radius:8px;background:var(--code);overflow:hidden}.code-head{height:38px;display:flex;align-items:center;padding:0 12px;background:#151c26;border-bottom:1px solid #303b49;color:#9da9b7;font:12px ui-monospace,monospace}.copy{margin-left:auto;border:1px solid #3a4655;border-radius:5px;background:#101720;color:#aeb9c7;padding:4px 9px;cursor:pointer}.copy:hover{color:#fff}.code pre{margin:0;padding:15px 18px;overflow:auto;color:#d7dee8;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.empty{color:var(--muted)}mark{background:#fff2a8;color:#151515;padding:0 .08em;border-radius:2px}@media(max-width:760px){header{padding:0 14px}.layout{display:block}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px 12px}.document{padding:20px}.toolbar{padding:0 4px}}
  </style>
</head>
<body><header><a class="brand" href="../index.html">H4G <span>Zen CTF Notes</span></a><a class="back" href="../index.html">Back to vault</a></header>
<div class="layout"><aside><div class="eyebrow">Operational Reference</div><h1>Zen CTF Notes</h1><p class="intro">Search CTF checklists, tool syntax, attack workflows, and focused web exploitation notes.</p><input id="search" class="search" type="search" placeholder="Search all notes…" autocomplete="off"><nav id="tree" aria-label="CTF notes"></nav></aside>
<main><div class="toolbar"><span id="status">Loading notes…</span><span id="count"></span></div><article id="document" class="document"><p class="empty">Loading the CTF notes vault…</p></article></main></div>
<script src="notes-data.js"></script><script>
const NOTES=window.ZEN_NOTES||[],tree=document.getElementById('tree'),doc=document.getElementById('document'),search=document.getElementById('search'),statusEl=document.getElementById('status'),countEl=document.getElementById('count');let active=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function score(note,q){if(!q)return 1;const terms=q.toLowerCase().split(/\s+/).filter(Boolean),title=note.title.toLowerCase(),hay=`${note.title} ${note.group} ${note.source} ${note.text||''}`.toLowerCase();return terms.every(t=>hay.includes(t))?terms.reduce((n,t)=>n+(title.includes(t)?5:1),0):0}
function mark(text,q){if(!q)return esc(text);const terms=q.split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));return esc(text).replace(new RegExp(`(${terms.join('|')})`,'ig'),'<mark>$1</mark>')}
function renderTree(){const q=search.value.trim(),visible=NOTES.map(n=>[n,score(n,q)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]||a[0].title.localeCompare(b[0].title)),groups=Map.groupBy?Map.groupBy(visible,x=>x[0].group):visible.reduce((m,x)=>(m.set(x[0].group,[...(m.get(x[0].group)||[]),x]),m),new Map);tree.innerHTML=[...groups].map(([group,items])=>`<details class="folder" open><summary>${mark(group,q)} <small>(${items.length})</small></summary>${items.map(([n])=>`<a class="note-link${n===active?' active':''}" href="#${n.id}" data-id="${n.id}"><span>${mark(n.title,q)}</span><small>${n.format}</small></a>`).join('')}</details>`).join('')||'<p class="empty">No matching notes.</p>';countEl.textContent=`${visible.length} of ${NOTES.length} entries`}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')}
function codePanel(source,lang='text'){return `<div class="code"><div class="code-head">${esc(lang||'text')}<button class="copy" type="button">Copy</button></div><pre>${esc(source)}</pre></div>`}
function markdown(text){const lines=text.split(/\r?\n/),out=[];let i=0,list='';const close=()=>{if(list){out.push(`</${list}>`);list=''}};while(i<lines.length){const line=lines[i];if(line.startsWith('```')){close();const lang=line.slice(3).trim();const buf=[];for(i++;i<lines.length&&!lines[i].startsWith('```');i++)buf.push(lines[i]);out.push(codePanel(buf.join('\n'),lang));i++;continue}const h=line.match(/^(#{1,4})\s+(.+)/);if(h){close();const level=Math.min(h[1].length+1,4);out.push(`<h${level}>${inline(h[2].replace(/^\*\*|\*\*$/g,''))}</h${level}>`);i++;continue}if(/^\|.*\|$/.test(line)&&i+1<lines.length&&/^\|(?:\s*:?-+:?\s*\|)+$/.test(lines[i+1])){close();const rows=[];const cells=x=>x.slice(1,-1).split('|').map(y=>y.trim());rows.push(cells(line));i+=2;while(i<lines.length&&/^\|.*\|$/.test(lines[i]))rows.push(cells(lines[i++]));out.push(`<div class="table-wrap"><table><thead><tr>${rows[0].map(x=>`<th>${inline(x)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${inline(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue}const item=line.match(/^\s*[-*]\s+(?:\[[ xX]\]\s*)?(.+)/);const numbered=line.match(/^\s*\d+\.\s+(.+)/);if(item||numbered){const wanted=item?'ul':'ol';if(list!==wanted){close();list=wanted;out.push(`<${list}>`)}out.push(`<li>${inline((item||numbered)[1])}</li>`);i++;continue}if(!line.trim()){close();i++;continue}close();const paragraph=[line];while(++i<lines.length&&lines[i].trim()&&!/^(?:#{1,4}\s|```|\s*[-*]\s|\s*\d+\.\s|\|)/.test(lines[i]))paragraph.push(lines[i]);out.push(`<p>${inline(paragraph.join(' '))}</p>`)}close();return out.join('')}
function show(note){active=note;const q=search.value.trim();doc.innerHTML=`<h1>${mark(note.title,q)}</h1><div class="source">${esc(note.group)} · ${esc(note.format)}</div><div class="content">${markdown(note.text)}</div>`;statusEl.textContent=note.group;document.title=`${note.title} | H4G Zen CTF Notes`;renderTree();window.scrollTo({top:0})}
tree.addEventListener('click',e=>{const link=e.target.closest('[data-id]');if(!link)return;e.preventDefault();history.replaceState(null,'',`#${link.dataset.id}`);show(NOTES.find(n=>n.id===link.dataset.id))});search.addEventListener('input',()=>{renderTree();if(active)show(active)});doc.addEventListener('click',async e=>{const button=e.target.closest('.copy');if(!button)return;await navigator.clipboard.writeText(button.closest('.code').querySelector('pre').textContent);button.textContent='Copied';setTimeout(()=>button.textContent='Copy',1200)});const wanted=location.hash.slice(1);show(NOTES.find(n=>n.id===wanted)||NOTES[0]);
</script></body></html>
