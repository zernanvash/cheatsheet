  <style>
    :root{color-scheme:dark;--bg:#070a0f;--panel:#0e141c;--panel2:#131b25;--line:#27313d;--text:#e8edf4;--muted:#929eac;--accent:#a5b4fc;--code:#090e14}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,sans-serif}button,input{font:inherit}a{color:var(--accent)}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:rgba(7,10,15,.95);backdrop-filter:blur(10px);z-index:4}.brand{font-weight:800;text-decoration:none;color:var(--text)}.brand span{color:var(--accent)}.back{text-decoration:none;color:var(--muted)}.back:hover{color:#fff}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:20px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:.72rem;font-weight:800}h1{font-size:1.5rem;margin:.25rem 0}.intro,.meta{color:var(--muted);font-size:.86rem}.search{width:100%;margin:12px 0 16px;border:1px solid var(--line);border-radius:6px;background:var(--code);color:var(--text);padding:10px}.folder{margin:5px 0}.folder summary{cursor:pointer;color:#cbd3dd;padding:7px 8px;border-radius:5px;font-weight:650;list-style:none}.folder summary::before{content:'▸';display:inline-block;width:18px;color:var(--muted)}.folder[open] summary::before{content:'▾'}.folder-title{color:inherit;text-decoration:none}.folder-title:hover{text-decoration:underline;color:#fff}.folder summary:hover,.note-link:hover{background:var(--panel2);color:#fff}.note-link{display:flex;justify-content:space-between;gap:8px;margin-left:12px;padding:7px 9px;color:var(--muted);text-decoration:none;border-left:1px solid var(--line)}.note-link.active{color:#fff;background:var(--panel2);border-left-color:var(--accent)}.note-link small{opacity:.65}main{min-width:0;padding:34px clamp(20px,5vw,70px)}.toolbar{max-width:980px;margin:0 auto 20px;color:var(--muted);display:flex;justify-content:space-between;gap:15px}.document{max-width:980px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(22px,5vw,54px)}.document h1{font-size:2.2rem;margin-bottom:.2rem}.document h2{font-size:1.4rem;margin-top:2.2rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}.document h3{font-size:1.08rem;margin-top:1.6rem}.source{color:var(--muted);font:12px ui-monospace,monospace}.content{margin-top:30px}.content p,.content li{color:#cbd3dd}.content code{background:var(--code);border:1px solid #202a35;border-radius:4px;padding:.12em .35em;font-family:ui-monospace,monospace}.content ul,.content ol{padding-left:1.35rem}.table-wrap{overflow:auto;margin:18px 0;border:1px solid var(--line);border-radius:7px}.content table{width:100%;border-collapse:collapse;min-width:650px}.content th,.content td{padding:9px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.content th{background:var(--panel2);color:#fff}.content tr:last-child td{border-bottom:0}.code{position:relative;margin:16px 0;border:1px solid #303b49;border-radius:8px;background:var(--code);overflow:hidden}.code-head{height:38px;display:flex;align-items:center;padding:0 12px;background:#151c26;border-bottom:1px solid #303b49;color:#9da9b7;font:12px ui-monospace,monospace}.copy{margin-left:auto;border:1px solid #3a4655;border-radius:5px;background:#101720;color:#aeb9c7;padding:4px 9px;cursor:pointer}.copy:hover{color:#fff}.code pre{margin:0;padding:15px 18px;overflow:auto;color:#d7dee8;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.empty{color:var(--muted)}mark{background:#fff2a8;color:#151515;padding:0 .08em;border-radius:2px}@media(max-width:760px){header{padding:0 14px}.layout{display:block}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px 12px}.document{padding:20px}.toolbar{padding:0 4px}}
    .toolbar{align-items:center}.toolbar-actions{display:flex;align-items:center;gap:8px}.ui-btn{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:#cbd3dd;padding:7px 11px;cursor:pointer}.ui-btn:hover:not(:disabled){color:#fff;border-color:#64748b}.ui-btn:disabled{opacity:.45;cursor:not-allowed}.ui-btn.primary{border-color:var(--accent);color:var(--accent)}.editor-bar{display:none;position:sticky;top:76px;z-index:3;max-width:980px;margin:0 auto 12px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#111923;box-shadow:0 10px 28px rgba(0,0,0,.28);gap:6px;align-items:center;flex-wrap:wrap}.editor-bar.show{display:flex}.editor-bar button{border:0;border-radius:5px;background:transparent;color:#cbd3dd;padding:6px 9px;cursor:pointer}.editor-bar button:hover{background:#263241;color:#fff}.editor-note{margin-left:auto;color:#facc15;font-size:.78rem}.editing [contenteditable=true]{outline:none}.editing .content{min-height:320px}.editing .content:focus,.editing .note-title:focus{box-shadow:inset 3px 0 var(--accent);padding-left:12px}.editing .copy{display:none}@media(max-width:760px){.editor-note{width:100%;margin:4px 0 0}}

<body><header><a class="brand" href="../index.html">H4G <span>Zen CTF Notes</span></a><a class="back" href="../index.html">Back to vault</a></header>
<div class="layout"><aside><div class="eyebrow">Operational Reference</div><h1>Zen CTF Notes</h1><p class="intro">Search CTF checklists, tool syntax, attack workflows, and focused web exploitation notes.</p><input id="search" class="search" type="search" placeholder="Search all notes…" autocomplete="off"><nav id="tree" aria-label="CTF notes"></nav></aside>
<main><div class="toolbar"><span id="status">Loading notes…</span><div class="toolbar-actions"><span id="count"></span><button id="edit" class="ui-btn" type="button" disabled>Edit</button><button id="cancel" class="ui-btn" type="button" hidden>Cancel</button><button id="save" class="ui-btn primary" type="button" hidden>Save</button></div></div><div id="editor-bar" class="editor-bar" aria-label="Editor formatting"><button type="button" data-format="p">Text</button><button type="button" data-format="h2">Heading 1</button><button type="button" data-format="h3">Heading 2</button><button type="button" data-command="bold"><strong>B</strong></button><button type="button" data-command="italic"><em>I</em></button><button type="button" data-command="insertUnorderedList">Bullets</button><button type="button" data-command="insertOrderedList">Numbered</button><button type="button" data-format="pre">Code</button><button type="button" data-link>Link</button><span class="editor-note">Public editing · changes are visible to everyone</span></div><article id="document" class="document"><p class="empty">Loading the CTF notes vault…</p></article></main></div>
<script src="notes-data.js"></script><script>
const NOTES=window.ZEN_NOTES||[],tree=document.getElementById('tree'),doc=document.getElementById('document'),search=document.getElementById('search'),statusEl=document.getElementById('status'),countEl=document.getElementById('count'),editBtn=document.getElementById('edit'),saveBtn=document.getElementById('save'),cancelBtn=document.getElementById('cancel'),editorBar=document.getElementById('editor-bar');let active=null,editing=false,apiReady=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function score(note,q){if(!q)return 1;const terms=q.toLowerCase().split(/\s+/).filter(Boolean),title=note.title.toLowerCase(),hay=`${note.title} ${note.group} ${note.source} ${note.text||''}`.toLowerCase();return terms.every(t=>hay.includes(t))?terms.reduce((n,t)=>n+(title.includes(t)?5:1),0):0}
function mark(text,q){if(!q)return esc(text);const terms=q.split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));return esc(text).replace(new RegExp(`(${terms.join('|')})`,'ig'),'<mark>$1</mark>')}
function renderTree(){const q=search.value.trim(),visible=NOTES.map(n=>[n,score(n,q)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]||a[0].title.localeCompare(b[0].title)),groups=Map.groupBy?Map.groupBy(visible,x=>x[0].group):visible.reduce((m,x)=>(m.set(x[0].group,[...(m.get(x[0].group)||[]),x]),m),new Map);tree.innerHTML=[...groups].map(([group,items])=>{const index=items.find(([n])=>n.folderIndex),children=items.filter(([n])=>!n.folderIndex),title=index?`<a class="folder-title${index[0]===active?' active':''}" href="#${index[0].id}" data-id="${index[0].id}">${mark(group,q)}</a>`:mark(group,q);return `<details class="folder" open><summary>${title} <small>(${children.length||items.length})</small></summary>${children.map(([n])=>`<a class="note-link${n===active?' active':''}" href="#${n.id}" data-id="${n.id}"><span>${mark(n.title,q)}</span><small>${n.format}</small></a>`).join('')}</details>`}).join('')||'<p class="empty">No matching notes.</p>';countEl.textContent=`${visible.length} of ${NOTES.length} entries`}
function noteForLink(label){const key=label.toLowerCase().replace(/[^a-z0-9]+/g,'');return NOTES.find(n=>n.title.toLowerCase().replace(/[^a-z0-9]+/g,'')===key)||NOTES.find(n=>n.group.toLowerCase().replace(/[^a-z0-9]+/g,'')===key)}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\([^)]+\)/g,(_,label)=>{const note=noteForLink(label);return note?`<a href="#${note.id}" data-note-id="${note.id}">${label}</a>`:label})}
function codePanel(source,lang='text'){return `<div class="code"><div class="code-head">${esc(lang||'text')}<button class="copy" type="button">Copy</button></div><pre>${esc(source)}</pre></div>`}
function markdown(text){const lines=text.split(/\r?\n/),out=[];let i=0,list='';const close=()=>{if(list){out.push(`</${list}>`);list=''}};while(i<lines.length){const line=lines[i];if(line.startsWith('```')){close();const lang=line.slice(3).trim();const buf=[];for(i++;i<lines.length&&!lines[i].startsWith('```');i++)buf.push(lines[i]);out.push(codePanel(buf.join('\n'),lang));i++;continue}const h=line.match(/^(#{1,4})\s+(.+)/);if(h){close();const level=Math.min(h[1].length+1,4);out.push(`<h${level}>${inline(h[2].replace(/^\*\*|\*\*$/g,''))}</h${level}>`);i++;continue}if(/^\|.*\|$/.test(line)&&i+1<lines.length&&/^\|(?:\s*:?-+:?\s*\|)+$/.test(lines[i+1])){close();const rows=[];const cells=x=>x.slice(1,-1).split('|').map(y=>y.trim());rows.push(cells(line));i+=2;while(i<lines.length&&/^\|.*\|$/.test(lines[i]))rows.push(cells(lines[i++]));out.push(`<div class="table-wrap"><table><thead><tr>${rows[0].map(x=>`<th>${inline(x)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${inline(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue}const item=line.match(/^\s*[-*]\s+(?:\[[ xX]\]\s*)?(.+)/);const numbered=line.match(/^\s*\d+\.\s+(.+)/);if(item||numbered){const wanted=item?'ul':'ol';if(list!==wanted){close();list=wanted;out.push(`<${list}>`)}out.push(`<li>${inline((item||numbered)[1])}</li>`);i++;continue}if(!line.trim()){close();i++;continue}close();const paragraph=[line];while(++i<lines.length&&lines[i].trim()&&!/^(?:#{1,4}\s|```|\s*[-*]\s|\s*\d+\.\s|\|)/.test(lines[i]))paragraph.push(lines[i]);out.push(`<p>${inline(paragraph.join(' '))}</p>`)}close();return out.join('')}
function enhanceContent(){doc.querySelectorAll('.code-head').forEach(head=>{if(!head.querySelector('.copy'))head.insertAdjacentHTML('beforeend','<button class="copy" type="button">Copy</button>')})}
function show(note){editing=false;active=note;const q=search.value.trim(),title=note.savedTitle||note.title,body=note.savedHtml||markdown(note.text);doc.classList.remove('editing');doc.innerHTML=`<h1 class="note-title">${mark(title,q)}</h1><div class="source">${esc(note.group)} · ${esc(note.format)}${note.updatedAt?` · edited ${esc(new Date(note.updatedAt).toLocaleString())}`:''}</div><div class="content">${body}</div>`;enhanceContent();statusEl.textContent=note.group;document.title=`${title} | H4G Zen CTF Notes`;editBtn.hidden=false;editBtn.disabled=!apiReady;saveBtn.hidden=cancelBtn.hidden=true;editorBar.classList.remove('show');renderTree();window.scrollTo({top:0})}
function beginEdit(){if(!active||!apiReady)return;editing=true;doc.classList.add('editing');doc.querySelector('.note-title').contentEditable='true';doc.querySelector('.content').contentEditable='true';editBtn.hidden=true;saveBtn.hidden=cancelBtn.hidden=false;editorBar.classList.add('show');doc.querySelector('.content').focus()}
async function saveEdit(){if(!editing)return;saveBtn.disabled=true;statusEl.textContent='Saving…';const clone=doc.querySelector('.content').cloneNode(true);clone.querySelectorAll('.copy').forEach(x=>x.remove());clone.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));try{const response=await fetch(`/api/zen-notes/${encodeURIComponent(active.id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:doc.querySelector('.note-title').innerText.trim(),html:clone.innerHTML,revision:active.revision||0})});const payload=await response.json();if(!response.ok)throw new Error(payload.error||`Save failed (${response.status})`);active.savedTitle=payload.note.title;active.title=payload.note.title;active.savedHtml=payload.note.html;active.revision=payload.note.revision;active.updatedAt=payload.note.updated_at;show(active);statusEl.textContent='Saved for everyone'}catch(error){statusEl.textContent=error.message;if(error.message.includes('changed since'))await loadEdits()}finally{saveBtn.disabled=false}}
async function loadEdits(){try{const response=await fetch('/api/zen-notes',{cache:'no-store'});if(!response.ok)throw new Error();const payload=await response.json();for(const note of NOTES){const saved=payload.notes?.[note.id];if(saved){note.savedTitle=saved.title;note.title=saved.title;note.savedHtml=saved.html;note.revision=saved.revision;note.updatedAt=saved.updated_at}}apiReady=true;editBtn.disabled=false;editBtn.title='Anyone can edit this shared note'}catch{apiReady=false;editBtn.disabled=true;editBtn.title='Shared editing API is not configured on this server'}renderTree()}
tree.addEventListener('click',e=>{const link=e.target.closest('[data-id]');if(!link)return;e.preventDefault();if(editing&&!confirm('Discard your unsaved edits?'))return;history.replaceState(null,'',`#${link.dataset.id}`);show(NOTES.find(n=>n.id===link.dataset.id))});search.addEventListener('input',()=>{renderTree();if(active&&!editing)show(active)});doc.addEventListener('click',async e=>{const noteLink=e.target.closest('[data-note-id]');if(noteLink&&!editing){e.preventDefault();const note=NOTES.find(n=>n.id===noteLink.dataset.noteId);if(note){history.replaceState(null,'',`#${note.id}`);show(note)}return}const button=e.target.closest('.copy');if(!button)return;await navigator.clipboard.writeText(button.closest('.code').querySelector('pre').textContent);button.textContent='Copied';setTimeout(()=>button.textContent='Copy',1200)});editBtn.addEventListener('click',beginEdit);cancelBtn.addEventListener('click',()=>show(active));saveBtn.addEventListener('click',saveEdit);editorBar.addEventListener('mousedown',e=>e.preventDefault());editorBar.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.format)document.execCommand('formatBlock',false,button.dataset.format);else if(button.dataset.command)document.execCommand(button.dataset.command,false);else if(button.hasAttribute('data-link')){const url=prompt('Link URL (https://…)');if(url)document.execCommand('createLink',false,url)}doc.querySelector('.content').focus()});window.addEventListener('beforeunload',e=>{if(editing){e.preventDefault();e.returnValue=''}});const wanted=location.hash.slice(1);loadEdits().finally(()=>show(NOTES.find(n=>n.id===wanted)||NOTES[0]));
</script></body></html>
