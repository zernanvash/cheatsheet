# Add these locations inside the ch.zernanvash.dev HTTPS server block.
# Keep client_max_body_size aligned with FILESHARE_MAX_FILE_BYTES.
location = /fileshare {
    return 301 /fileshare/;
}

location ^~ /fileshare/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /api/fileshare {
    limit_except GET POST { deny all; }
    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
}

location ^~ /api/fileshare/download/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
}
