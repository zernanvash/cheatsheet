# Add this location inside the existing ch.zernanvash.dev server block.
location = /api/cipher-identify {
    limit_except POST { deny all; }
    client_max_body_size 24k;
    proxy_pass http://127.0.0.1:8787/api/cipher-identify;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
}

# Static deployment compatibility: /cipher-identifier -> directory index.
location = /cipher-identifier {
    return 301 /cipher-identifier/;
}
