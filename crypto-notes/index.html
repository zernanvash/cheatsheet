<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
  <title>Crypto Notes | H4G</title>
  <style>
    :root{color-scheme:dark;--bg:#070a0f;--panel:#0e141c;--panel2:#131b25;--line:#27313d;--text:#e8edf4;--muted:#929eac;--accent:#a5b4fc;--code:#090e14}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,sans-serif}a{color:var(--accent)}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:rgba(7,10,15,.94);backdrop-filter:blur(10px);z-index:3}.brand{font-weight:800;text-decoration:none;color:var(--text)}.brand span{color:var(--accent)}.back{text-decoration:none;color:var(--muted)}.back:hover{color:#fff}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:20px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:.72rem;font-weight:800}h1{font-size:1.5rem;margin:.25rem 0}.intro{color:var(--muted);font-size:.86rem}.search{width:100%;margin:12px 0 16px;border:1px solid var(--line);border-radius:6px;background:var(--code);color:var(--text);padding:10px;font:inherit}.tree{display:grid;gap:4px}.note-link{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none;border:1px solid transparent}.note-link:hover{color:#fff;background:var(--panel2)}.note-link.active{color:#fff;border-color:#475569;background:var(--panel2)}.note-link small{opacity:.65}main{min-width:0;padding:34px clamp(20px,5vw,70px)}.toolbar{max-width:920px;margin:0 auto 20px;color:var(--muted);display:flex;justify-content:space-between}.document{max-width:920px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(22px,5vw,54px)}.document h1{font-size:2.2rem}.document h2{font-size:1.35rem;margin-top:2.2rem;padding-bottom:.35rem;border-bottom:1px solid var(--line)}.document h3{font-size:1.05rem;margin-top:1.6rem}.document p,.document li{color:#cbd3dd}.document table{width:100%;border-collapse:collapse;display:block;overflow:auto}.document th,.document td{border:1px solid var(--line);padding:8px 10px;text-align:left}.document th{background:var(--panel2)}.document code{font-family:ui-monospace,monospace;background:var(--code);padding:.12em .35em;border-radius:4px}.document blockquote{margin-left:0;border-left:3px solid var(--accent);padding-left:14px;color:var(--muted)}.ide{margin:18px 0;border:1px solid #303b49;border-radius:9px;overflow:hidden;background:#080d13;box-shadow:0 12px 28px rgba(0,0,0,.22)}.ide-bar{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#151c26;border-bottom:1px solid #303b49}.ide-dots{display:flex;gap:6px}.ide-dot{width:10px;height:10px;border-radius:50%}.ide-dot:nth-child(1){background:#ff5f57}.ide-dot:nth-child(2){background:#febc2e}.ide-dot:nth-child(3){background:#28c840}.ide-lang{margin-left:7px;color:#b8c1ce;font:12px ui-monospace,monospace}.ide-copy{margin-left:auto;border:1px solid #3a4655;border-radius:5px;background:#101720;color:#aeb9c7;padding:4px 9px;font:11px system-ui;cursor:pointer}.ide-copy:hover{color:#fff;border-color:#64748b}.ide pre{margin:0;padding:14px 0;overflow:auto;background:#080d13;tab-size:4}.ide pre code{display:block;counter-reset:line;background:none;padding:0;border-radius:0;font:13px/1.62 ui-monospace,SFMono-Regular,Consolas,monospace}.code-line{display:block;min-height:1.62em;padding:0 18px 0 58px;position:relative;white-space:pre}.code-line::before{counter-increment:line;content:counter(line);position:absolute;left:0;width:42px;padding-right:10px;text-align:right;color:#485565;border-right:1px solid #1d2631;user-select:none}.tok-comment{color:#6a9955;font-style:italic}.tok-string{color:#ce9178}.tok-keyword{color:#c586c0}.tok-number{color:#b5cea8}.tok-call{color:#dcdcaa}.loading,.empty{color:var(--muted)}@media(max-width:760px){header{padding:0 14px}.layout{display:block}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.tree{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:20px 12px}.document{padding:20px}.toolbar{padding:0 4px}.code-line{padding-left:50px}}
  </style>
</head>
<body><header><a class="brand" href="../index.html">H4G <span>Crypto Notes</span></a><a class="back" href="../index.html">Back to vault</a></header>
<div class="layout"><aside><div class="eyebrow">Field Reference</div><h1>Cryptography Notes</h1><p class="intro">Short recall notes for active CTF work. Search titles and note contents.</p><input id="search" class="search" type="search" placeholder="Search crypto notes…" autocomplete="off"><nav id="tree" class="tree" aria-label="Crypto notes"></nav></aside>
<main><div class="toolbar"><span id="status">Loading notes…</span><a id="source-link" href="#">Open source note</a></div><article id="document" class="document"><p class="loading">Loading the cryptography vault…</p></article></main></div>
<script>
const NOTES=[
  ['classical-ciphers.md','Classical Ciphers','Classical'],['vigenere.md','Vigenère Cipher','Classical'],['xor.md','XOR','Symmetric'],['aes.md','AES','Symmetric'],['padding-oracle.md','Padding Oracle','Symmetric'],
  ['rsa.md','RSA','Public Key'],['weak-structured-primes.md','Weak & Structured RSA Primes','Public Key'],['chinese-remainder-theorem.md','Chinese Remainder Theorem','Public Key'],['diffie-hellman.md','Diffie–Hellman','Public Key'],['ecc.md','Elliptic Curve Cryptography','Public Key'],['hash.md','Hashes','Integrity']
].map(([file,title,group])=>({file,title,group,text:''}));
const $=id=>document.getElementById(id);let active=null;
const escapeHtml=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function inline(s){return escapeHtml(s).replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\[\[([^\]]+)\]\]/g,'<code>[[$1]]</code>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');}
function highlight(line,lang){
  const pattern=/(#[^\n]*|\/\/[^\n]*|'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|\b(?:def|class|return|if|else|elif|for|while|in|from|import|as|try|except|with|lambda|yield|assert|and|or|not|None|True|False|function|const|let|var|new|throw|async|await)\b|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*(?=\())/g;
  let out='',last=0;for(const match of line.matchAll(pattern)){out+=escapeHtml(line.slice(last,match.index));const token=match[0];let cls='tok-call';if(token.startsWith('#')||token.startsWith('//'))cls='tok-comment';else if(/^['"]/.test(token))cls='tok-string';else if(/^\d/.test(token))cls='tok-number';else if(/^(def|class|return|if|else|elif|for|while|in|from|import|as|try|except|with|lambda|yield|assert|and|or|not|None|True|False|function|const|let|var|new|throw|async|await)$/.test(token))cls='tok-keyword';out+=`<span class="${cls}">${escapeHtml(token)}</span>`;last=match.index+token.length;}return out+escapeHtml(line.slice(last));
}
function codePanel(source,lang){const language=lang||'text';const lines=source.split('\n').map(line=>`<span class="code-line">${highlight(line,language)||' '}</span>`).join('');return `<div class="ide"><div class="ide-bar"><span class="ide-dots"><i class="ide-dot"></i><i class="ide-dot"></i><i class="ide-dot"></i></span><span class="ide-lang">${escapeHtml(language)}</span><button class="ide-copy" type="button">Copy</button></div><pre><code>${lines}</code></pre></div>`;}
function markdown(md){
  const lines=md.replace(/^---\s*[\s\S]*?\n---\s*/,'').split(/\r?\n/);let out='',list=null,code=false,lang='',buf=[];
  const closeList=()=>{if(list){out+=`</${list}>`;list=null;}};
  for(const line of lines){
    if(line.startsWith('```')){if(code){out+=codePanel(buf.join('\n'),lang);code=false;buf=[];}else{closeList();code=true;lang=line.slice(3).trim();}continue;}if(code){buf.push(line);continue;}
    const heading=line.match(/^(#{1,3})\s+(.+)/);if(heading){closeList();const n=heading[1].length;out+=`<h${n}>${inline(heading[2].replace(/\*\*/g,''))}</h${n}>`;continue;}
    if(/^\s*[-*]\s+/.test(line)){if(list!=='ul'){closeList();list='ul';out+='<ul>';}out+=`<li>${inline(line.replace(/^\s*[-*]\s+/,''))}</li>`;continue;}
    if(/^\s*\d+\.\s+/.test(line)){if(list!=='ol'){closeList();list='ol';out+='<ol>';}out+=`<li>${inline(line.replace(/^\s*\d+\.\s+/,''))}</li>`;continue;}
    if(line.startsWith('> ')){closeList();out+=`<blockquote>${inline(line.slice(2))}</blockquote>`;continue;}
    if(/^\|.*\|$/.test(line)){closeList();const cells=line.slice(1,-1).split('|').map(x=>x.trim());if(cells.every(x=>/^:?-+:?$/.test(x)))continue;out+=`<div style="display:grid;grid-template-columns:repeat(${cells.length},minmax(120px,1fr));border-bottom:1px solid var(--line)">${cells.map(x=>`<div style="padding:7px">${inline(x)}</div>`).join('')}</div>`;continue;}
    if(!line.trim()){closeList();continue;}closeList();out+=`<p>${inline(line)}</p>`;
  }closeList();return out;
}
function renderTree(query=''){const q=query.toLowerCase();const visible=NOTES.filter(n=>!q||`${n.title} ${n.group} ${n.text}`.toLowerCase().includes(q));$('tree').innerHTML=visible.map(n=>`<a class="note-link${n===active?' active':''}" href="#${encodeURIComponent(n.file.replace('.md',''))}" data-file="${n.file}"><span>${n.title}</span><small>${n.group}</small></a>`).join('')||'<span class="empty">No matching notes.</span>';}
function show(note){active=note;$('document').innerHTML=markdown(note.text);$('status').textContent=note.group;$('source-link').href=`../cryptography_notes/${encodeURIComponent(note.file)}`;$('source-link').textContent='Open source note';document.title=`${note.title} | H4G Crypto Notes`;renderTree($('search').value);window.scrollTo({top:0});}
async function init(){await Promise.all(NOTES.map(async n=>{const response=await fetch(`../cryptography_notes/${encodeURIComponent(n.file)}`,{cache:'no-cache'});if(!response.ok)throw new Error(`${n.file}: HTTP ${response.status}`);n.text=await response.text();}));const wanted=decodeURIComponent(location.hash.slice(1));show(NOTES.find(n=>n.file.replace('.md','')===wanted)||NOTES[0]);}
$('tree').addEventListener('click',e=>{const link=e.target.closest('[data-file]');if(!link)return;e.preventDefault();const note=NOTES.find(n=>n.file===link.dataset.file);history.replaceState(null,'',`#${encodeURIComponent(note.file.replace('.md',''))}`);show(note);});$('search').addEventListener('input',e=>renderTree(e.target.value));window.addEventListener('hashchange',()=>{const note=NOTES.find(n=>n.file.replace('.md','')===decodeURIComponent(location.hash.slice(1)));if(note)show(note);});init().catch(error=>{$('status').textContent='Load error';$('document').innerHTML=`<p class="empty">${escapeHtml(error.message)}. Serve this vault over HTTP rather than opening the file directly.</p>`;});
$('document').addEventListener('click',async e=>{const button=e.target.closest('.ide-copy');if(!button)return;const code=button.closest('.ide').querySelector('code');await navigator.clipboard.writeText([...code.querySelectorAll('.code-line')].map(line=>line.textContent===' '?'':line.textContent).join('\n'));button.textContent='Copied';setTimeout(()=>button.textContent='Copy',1200);});
</script></body></html>
